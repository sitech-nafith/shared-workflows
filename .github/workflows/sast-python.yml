name: SAST — Bandit (Python)

on:
  workflow_call:
    inputs:
      python_version:
        description: "Python version to use"
        type: string
        default: "3.12"
      scan_paths:
        description: "Space-separated list of paths to scan"
        type: string
        default: "app/"
      severity_level:
        description: "Minimum severity level to report (low, medium, high)"
        type: string
        default: "medium"
      confidence_level:
        description: "Minimum confidence level to report (low, medium, high)"
        type: string
        default: "medium"

jobs:
  sast-python:
    name: Bandit — SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # required to post SARIF results to the Security tab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        id: bandit
        run: |
          # First pass: JSON output for artifact and Summary parsing
          bandit -r ${{ inputs.scan_paths }} \
            --severity-level ${{ inputs.severity_level }} \
            --confidence-level ${{ inputs.confidence_level }} \
            -f json -o bandit-report.json || true
          # Second pass: human-readable output in the log; non-zero exit fails the step
          bandit -r ${{ inputs.scan_paths }} \
            --severity-level ${{ inputs.severity_level }} \
            --confidence-level ${{ inputs.confidence_level }}

      - name: Convert Bandit JSON to SARIF
        # Bandit has no native SARIF formatter, so we convert the JSON report ourselves.
        # This runs even on failure so the Security tab is populated when issues are found.
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os

          SEV_MAP = {"HIGH": "error", "MEDIUM": "warning", "LOW": "note"}

          if not os.path.exists("bandit-report.json"):
              print("No bandit-report.json found — skipping SARIF generation.")
              exit(0)

          with open("bandit-report.json") as f:
              data = json.load(f)

          rules = {}
          results = []
          workspace = os.environ.get("GITHUB_WORKSPACE", "")

          for finding in data.get("results", []):
              rule_id = finding.get("test_id", "UNKNOWN")
              rule_name = finding.get("test_name", rule_id)
              if rule_id not in rules:
                  rules[rule_id] = {
                      "id": rule_id,
                      "name": rule_name,
                      "shortDescription": {"text": rule_name},
                      "helpUri": f"https://bandit.readthedocs.io/en/latest/plugins/{rule_id.lower()}.html"
                  }
              filepath = finding.get("filename", "")
              if workspace and filepath.startswith(workspace):
                  filepath = filepath[len(workspace):].lstrip("/")
              results.append({
                  "ruleId": rule_id,
                  "level": SEV_MAP.get(finding.get("issue_severity", "LOW"), "note"),
                  "message": {"text": finding.get("issue_text", "")},
                  "locations": [{
                      "physicalLocation": {
                          "artifactLocation": {"uri": filepath, "uriBaseId": "%SRCROOT%"},
                          "region": {"startLine": finding.get("line_number", 1)}
                      }
                  }]
              })

          sarif = {
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              "version": "2.1.0",
              "runs": [{"tool": {"driver": {
                  "name": "Bandit",
                  "informationUri": "https://bandit.readthedocs.io",
                  "rules": list(rules.values())
              }}, "results": results}]
          }
          with open("bandit.sarif", "w") as f:
              json.dump(sarif, f, indent=2)
          print(f"Generated bandit.sarif with {len(results)} result(s).")
          EOF

      - name: Upload artifacts
        # Upload both formats: JSON for debugging, SARIF for Code Scanning
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: |
            bandit-report.json
            bandit.sarif

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit  # groups results under this label in the Security tab

      - name: Summary
        if: always()
        run: |
          echo "## SAST (Bandit)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f bandit-report.json ]; then
            python3 - <<'EOF'
          import json, os
          with open("bandit-report.json") as f:
              data = json.load(f)
          metrics = data.get("metrics", {}).get("_totals", {})
          hi = int(metrics.get("SEVERITY.HIGH", 0))
          me = int(metrics.get("SEVERITY.MEDIUM", 0))
          lo = int(metrics.get("SEVERITY.LOW", 0))
          status = "PASSED" if hi == 0 and me == 0 else "FAILED"
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a") as s:
              s.write(f"| Status | High | Medium | Low |\n")
              s.write(f"|---|---|---|---|\n")
              s.write(f"| {status} | {hi} | {me} | {lo} |\n")
          EOF
          else
            echo "| Status |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| PASSED — no issues found |" >> "$GITHUB_STEP_SUMMARY"
          fi

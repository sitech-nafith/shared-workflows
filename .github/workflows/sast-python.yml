name: SAST — Bandit (Python)

on:
  workflow_call:
    inputs:
      python_version:
        description: "Python version to use"
        type: string
        default: "3.12"
      scan_paths:
        description: "Space-separated list of paths to scan"
        type: string
        default: "app/"
      severity_level:
        description: "Minimum severity level to report (low, medium, high)"
        type: string
        default: "medium"
      confidence_level:
        description: "Minimum confidence level to report (low, medium, high)"
        type: string
        default: "medium"

jobs:
  sast-python:
    name: Bandit — SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # required to post SARIF results to the Security tab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        id: bandit
        run: |
          bandit -r ${{ inputs.scan_paths }} \
            --severity-level ${{ inputs.severity_level }} \
            --confidence-level ${{ inputs.confidence_level }} \
            -f sarif -o bandit.sarif || true
          bandit -r ${{ inputs.scan_paths }} \
            --severity-level ${{ inputs.severity_level }} \
            --confidence-level ${{ inputs.confidence_level }}

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit.sarif

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit  # groups results under this label in the Security tab

      - name: Summary
        if: always()
        run: |
          echo "## SAST (Bandit)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f bandit.sarif ]; then
            python3 - <<'EOF'
          import json, os
          # Bandit SARIF maps severity to SARIF levels: HIGH=error, MEDIUM=warning, LOW=note
          with open("bandit.sarif") as f:
              data = json.load(f)
          results = [r for run in data.get("runs", []) for r in run.get("results", [])]
          hi = sum(1 for r in results if r.get("level") == "error")
          me = sum(1 for r in results if r.get("level") == "warning")
          lo = sum(1 for r in results if r.get("level") == "note")
          status = "PASSED" if hi == 0 and me == 0 else "FAILED"
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a") as s:
              s.write(f"| Status | High | Medium | Low |\n")
              s.write(f"|---|---|---|---|\n")
              s.write(f"| {status} | {hi} | {me} | {lo} |\n")
          EOF
          else
            echo "| Status |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| PASSED — no issues found |" >> "$GITHUB_STEP_SUMMARY"
          fi

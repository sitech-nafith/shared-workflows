name: Playwright Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ master, create-runner-init.sh-for-selfhosted-runner-on-OCI ]
    types: [opened, synchronize, ready_for_review]
    paths:
      - 'playwright/**'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [ master, create-runner-init.sh-for-selfhosted-runner-on-OCI ]
    paths:
      - 'playwright/**'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  actions: write
  contents: read

# Cancel previous runs on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  start-runner:
    uses: ./.github/workflows/oci-start-runner.yml
    secrets: inherit

  test:
    name: Playwright E2E
    needs: start-runner
    runs-on: [self-hosted, linux, arm64, oci]

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 3️⃣ Cache Playwright browsers
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # 4️⃣ Install Playwright browsers (skipped if cache hit)
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install

      # 5️⃣ Load Beta environment variables
      - name: Load Beta Environment Variables
        run: |
          grep -v '^#' .env.beta >> $GITHUB_ENV

      # 6️⃣ Run Playwright tests
      - name: Run Playwright tests
        run: npx playwright test tests/workflowTest.spec.ts

      # 7️⃣ Upload HTML report
      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Upload screenshots and traces on failure
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: test-results/
          retention-days: 7

      # 8️⃣ Send notifications
      - name: Slack Notification
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "Playwright Tests - ${{ job.status }}"
          SLACK_MESSAGE: |
              Repository: ${{ github.repository }}
              Branch: ${{ github.ref_name }}
              Workflow: ${{ github.workflow }}
              Status: *${{ job.status }}*
              View HTML Report: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Click here>

  stop-runner:
    needs: [start-runner, test]
    if: always()
    uses: ./.github/workflows/oci-stop-runner.yml
    with:
      instance-id: ${{ needs.start-runner.outputs.instance-id }}
    secrets: inherit

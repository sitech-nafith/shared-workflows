name: Playwright E2E Tests

# Reusable template for Playwright E2E testing.
# The test code STAYS in the calling repository — this workflow only orchestrates the run.
# See: https://github.com/sitech-nafith/shared-workflows
#
# CI/CD position (per flow diagram):
#   push → PR → staging deploy (ArgoCD green) → [THIS WORKFLOW] → release sign-off → prod deploy

on:
  workflow_call:
    inputs:
      # ── Environment ──────────────────────────────────────────────────────────
      test_env:
        description: >
          Environment name — loads .env.<test_env> from the caller repo if present
          (e.g. alpha, beta, staging). Determines which credentials/URLs are active.
        type: string
        default: 'beta'
      base_url:
        description: >
          Override BASE_URL at runtime. Leave empty to use the value in .env.<test_env>.
          Inject the ArgoCD staging URL here so tests always run against the freshly deployed env.
        type: string
        default: ''

      # ── Test execution ───────────────────────────────────────────────────────
      test_command:
        description: >
          Command to run tests. Examples:
            npm test                               (main config only)
            npm run test:all                       (main + SSO configs)
            npx playwright test --project=chromium (single project)
        type: string
        default: 'npm test'
      config_file:
        description: "Playwright config file (informational — set the config via test_command)"
        type: string
        default: 'playwright.config.ts'
      working_directory:
        description: "Directory containing package.json and playwright config (relative to repo root)"
        type: string
        default: '.'

      # ── Runtime ──────────────────────────────────────────────────────────────
      node_version:
        description: "Node.js version (e.g. 'lts/*', '20', '18')"
        type: string
        default: 'lts/*'
      browsers:
        description: >
          Space-separated browsers to install (chromium firefox webkit).
          Defaults to chromium only — extend for cross-browser runs.
        type: string
        default: 'chromium'
      timeout_minutes:
        description: "Job timeout in minutes"
        type: number
        default: 30

      # ── Artifacts & notifications ─────────────────────────────────────────────
      upload_report:
        description: "Upload Playwright HTML report as a workflow artifact"
        type: boolean
        default: true
      report_retention_days:
        description: "Days to retain the HTML report artifact"
        type: number
        default: 14
      notify_slack:
        description: "Send a Slack notification when the job completes"
        type: boolean
        default: false

    secrets:
      slack_webhook:
        description: "Slack incoming webhook URL (required when notify_slack is true)"
        required: false

jobs:
  playwright:
    name: "Playwright E2E — ${{ inputs.test_env }}"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read  # checkout only — no write access needed
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        # Checks out the CALLER's repository so the test code, fixtures,
        # and .env.* files are all available without any code migration.
        uses: actions/checkout@v4

      # ── 2. Node.js + npm cache ───────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          # Path is relative to workspace root, not working-directory
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ── 3. Playwright browser cache ──────────────────────────────────────────
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Key includes browsers string so different browser combos get separate caches
          key: playwright-${{ runner.os }}-${{ inputs.browsers }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # --with-deps installs required system libraries (libgbm etc.) on Ubuntu runners
        run: npx playwright install --with-deps ${{ inputs.browsers }}

      # ── 4. Environment setup ─────────────────────────────────────────────────
      - name: Load environment file
        # Loads .env.<test_env> from the caller repo into GITHUB_ENV so all
        # subsequent steps (including globalSetup.ts) can read the variables.
        # If the file doesn't exist, tests fall back to playwright config defaults.
        run: |
          ENV_FILE=".env.${{ inputs.test_env }}"
          if [ -f "$ENV_FILE" ]; then
            echo "Loading $ENV_FILE"
            grep -v '^#' "$ENV_FILE" | grep -v '^$' >> "$GITHUB_ENV"
          else
            echo "$ENV_FILE not found — relying on BASE_URL input or playwright config defaults."
          fi

      - name: Override BASE_URL
        if: inputs.base_url != ''
        # Applied after .env load so the input always takes precedence.
        # This is the injection point for ArgoCD staging URLs in the CI/CD flow.
        run: echo "BASE_URL=${{ inputs.base_url }}" >> "$GITHUB_ENV"

      # ── 5. Run tests ─────────────────────────────────────────────────────────
      - name: Run Playwright tests
        run: ${{ inputs.test_command }}

      # ── 6. Artifacts ─────────────────────────────────────────────────────────
      - name: Upload HTML report
        if: always() && inputs.upload_report
        uses: actions/upload-artifact@v4
        with:
          # run_id suffix prevents name collisions when the workflow is called multiple times
          name: playwright-report-${{ inputs.test_env }}-${{ github.run_id }}
          path: ${{ inputs.working_directory }}/playwright-report/
          retention-days: ${{ inputs.report_retention_days }}
          if-no-files-found: ignore

      - name: Upload test artifacts on failure
        if: failure()
        # Screenshots and traces only on failure — keeps storage lean
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ inputs.test_env }}-${{ github.run_id }}
          path: ${{ inputs.working_directory }}/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # ── 7. Summary ───────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          BASE_URL_DISPLAY="${{ inputs.base_url }}"
          [ -z "$BASE_URL_DISPLAY" ] && BASE_URL_DISPLAY="(from .env.${{ inputs.test_env }})"
          echo "## Playwright E2E — \`${{ inputs.test_env }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`${{ inputs.test_env }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Base URL | \`$BASE_URL_DISPLAY\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Config | \`${{ inputs.config_file }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Command | \`${{ inputs.test_command }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Browsers | \`${{ inputs.browsers }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"

      # ── 8. Slack notification ────────────────────────────────────────────────
      - name: Slack notification
        if: always() && inputs.notify_slack
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.slack_webhook }}
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "Playwright E2E — ${{ inputs.test_env }} — ${{ job.status }}"
          SLACK_MESSAGE: |
            *Repo:* ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}
            *Environment:* `${{ inputs.test_env }}`
            *Status:* *${{ job.status }}*
            *Report:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>

name: Secret Scan (Gitleaks)

on:
  workflow_call:
    inputs:
      gitleaks_version:
        description: "Gitleaks release version to install"
        type: string
        default: "8.27.2"
      full_history:
        description: "Scan full git history (fetch-depth: 0). Set false to scan HEAD only."
        type: boolean
        default: true

jobs:
  secret-scan:
    name: Gitleaks — secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.full_history && 0 || 1 }}

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="${{ inputs.gitleaks_version }}"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        id: gitleaks
        run: |
          gitleaks detect --source . --log-opts="--all" -v --report-format json --report-path gitleaks-report.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## Secret Scan (Gitleaks)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f gitleaks-report.json ] && [ "$(cat gitleaks-report.json)" != "null" ] && [ "$(wc -c < gitleaks-report.json)" -gt 4 ]; then
            COUNT=$(python3 -c "import json,sys; d=json.load(open('gitleaks-report.json')); print(len(d) if isinstance(d,list) else 0)" 2>/dev/null || echo "?")
            echo "| Status | Findings |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| FAILED | $COUNT secret(s) detected |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Status | Findings |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| PASSED | No secrets detected |" >> "$GITHUB_STEP_SUMMARY"
          fi

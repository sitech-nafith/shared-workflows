name: Secret Scan (Gitleaks)

on:
  workflow_call:
    inputs:
      gitleaks_version:
        description: "Gitleaks release version to install"
        type: string
        default: "8.27.2"
      full_history:
        description: "Scan full git history (fetch-depth: 0). Set false to scan HEAD only."
        type: boolean
        default: true

jobs:
  secret-scan:
    name: Gitleaks — secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # required to post SARIF results to the Security tab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.full_history && 0 || 1 }}

      - name: Cache Gitleaks binary
        id: cache-gitleaks
        uses: actions/cache@v4
        with:
          path: /tmp/gitleaks-bin
          key: gitleaks-${{ inputs.gitleaks_version }}-linux-x64

      - name: Install Gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/gitleaks-bin
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${{ inputs.gitleaks_version }}/gitleaks_${{ inputs.gitleaks_version }}_linux_x64.tar.gz" \
            | tar -xz -C /tmp/gitleaks-bin gitleaks

      - name: Add Gitleaks to PATH
        run: echo "/tmp/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Run Gitleaks
        id: gitleaks
        run: |
          gitleaks detect --source . --log-opts="--all" -v --report-format sarif --report-path gitleaks.sarif

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks  # groups results under this label in the Security tab

      - name: Summary
        if: always()
        run: |
          echo "## Secret Scan (Gitleaks)" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | Findings |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          if [ -f gitleaks.sarif ]; then
            COUNT=$(python3 -c "
          import json, sys
          with open('gitleaks.sarif') as f:
              data = json.load(f)
          results = [r for run in data.get('runs', []) for r in run.get('results', [])]
          print(len(results))
          " 2>/dev/null || echo "?")
            if [ "$COUNT" = "0" ]; then
              echo "| PASSED | No secrets detected |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| FAILED | $COUNT secret(s) detected |" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "| PASSED | No secrets detected |" >> "$GITHUB_STEP_SUMMARY"
          fi

name: "[Test] Lint & Format — Ruff"

# Triggers: manual run at any time, or automatically when the workflow under
# test or its fixtures change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/lint-python.yml
      - .github/workflows/test-lint.yml
      - test/**
  pull_request:
    paths:
      - .github/workflows/lint-python.yml
      - .github/workflows/test-lint.yml
      - test/**

jobs:
  lint:
    uses: ./.github/workflows/lint-python.yml
    with:
      lint_paths: "test/"  # lint only the test fixtures, not the whole repo

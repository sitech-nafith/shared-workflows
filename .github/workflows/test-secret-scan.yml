name: "[Test] Secret Scan"

# Triggers: manual run at any time, or automatically when the workflow under
# test changes so regressions are caught on every push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/secret-scan.yml
      - .github/workflows/test-secret-scan.yml
  pull_request:
    paths:
      - .github/workflows/secret-scan.yml
      - .github/workflows/test-secret-scan.yml

jobs:
  secret-scan:
    uses: ./.github/workflows/secret-scan.yml
    with:
      full_history: false  # scan HEAD only — full history is slower and not needed for a workflow test
